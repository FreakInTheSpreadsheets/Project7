<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Argus Observatory</title>
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#010204}
#argusFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#010204}
</style>
</head>
<body>
<iframe id="argusFrame" src="field-10-observatory.html?v=11-occurrence-performance" allow="fullscreen" allowfullscreen></iframe>
<script>
const frame=document.getElementById('argusFrame');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const patch=d.createElement('script');
  patch.textContent=`
(()=>{
  if(window.__ARGUS_OCCURRENCE_PERFORMANCE_PATCH__)return;
  window.__ARGUS_OCCURRENCE_PERFORMANCE_PATCH__='11.0';

  ui.minN=finite(ui.minN,0);
  let ARGUS_MAX_N=1;

  function refreshOccurrenceRange(){
    let mx=1;
    const q=DATA?.qualified_meta||{};
    for(const k in q)mx=Math.max(mx,finite(q[k]?.n,0));
    ARGUS_MAX_N=mx;
    return mx;
  }

  function occurrenceScale(n){
    n=Math.max(0,finite(n,0));
    if(!n)return .04;
    const ceiling=Math.max(100,ARGUS_MAX_N);
    return clamp(Math.log1p(n)/Math.log1p(ceiling),0,1);
  }

  const __nodeVisible=nodeVisible;
  nodeVisible=function(si){
    if(!__nodeVisible(si))return false;
    const floor=Math.max(0,finite(ui.minN,0));
    if(floor>0){
      const q=qmeta(si);
      if(!q||finite(q.n,0)<floor)return false;
    }
    return true;
  };

  const __nodeRadius=nodeRadius;
  nodeRadius=function(si,u,pf){
    if(ui.size!=='sample')return __nodeRadius(si,u,pf);
    const q=qmeta(si),v=occurrenceScale(q?.n||0);
    return clamp((.58+3.55*v)*pf*4.6,.55,10.5);
  };

  const __paintNodeMark=paintNodeMark;
  paintNodeMark=function(si,x,y,r){
    const q=qmeta(si),net=q?finite(q.net,0):0,mag=q?clamp(Math.abs(net)/5,0,1):0;

    if(q&&net>0){
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      const haloR=r*(2.2+2.1*mag);
      const g=ctx.createRadialGradient(x,y,Math.max(.2,r*.12),x,y,haloR);
      g.addColorStop(0,'rgba(255,255,255,'+(.10+.22*mag)+')');
      g.addColorStop(.28,'rgba(205,244,255,'+(.06+.16*mag)+')');
      g.addColorStop(1,'rgba(160,220,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,haloR,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    ctx.save();
    if(q&&net<0)ctx.globalAlpha*=clamp(.70-.42*mag,.22,.70);
    if(q&&net>0){
      ctx.shadowColor='rgba(240,252,255,'+(.58+.38*mag)+')';
      ctx.shadowBlur=Math.max(finite(ctx.shadowBlur,0),8+28*mag);
    }
    __paintNodeMark(si,x,y,r);
    ctx.restore();

    if(q){
      const dir=clamp(finite(q.dir,.5),0,1),cons=clamp((dir-.5)*2,0,1);
      if(cons>.01){
        ctx.save();
        ctx.strokeStyle='rgba(225,248,255,'+(.08+.46*cons)+')';
        ctx.lineWidth=.45+2.35*cons;
        ctx.beginPath();ctx.arc(x,y,r*(1.34+.18*cons),0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }
    }
  };

  const __updateStats=updateStats;
  updateStats=function(){
    __updateStats();
    const n=Math.max(0,finite(ui.minN,0));
    if(n>0){
      const el=document.getElementById('stats');
      if(el&&!el.textContent.includes('N≥'))el.textContent+=' · N≥'+n;
    }
  };

  const __renderDrawer=renderDrawer;
  renderDrawer=function(){
    ui.minN=Math.max(0,finite(ui.minN,0));
    refreshOccurrenceRange();
    __renderDrawer();
    const drawer=document.getElementById('drawer');
    if(!drawer)return;

    const sampleBtn=drawer.querySelector('[data-key="size"][data-val="sample"]');
    if(sampleBtn)sampleBtn.textContent='OCCURRENCES';

    const cutoffSec=drawer.querySelector('#cut')?.closest('.sec');

    const grammar=document.createElement('div');
    grammar.className='sec';
    grammar.innerHTML='<div class="label">NODE LANGUAGE</div><div style="font-size:9px;line-height:1.55;color:rgba(220,241,248,.62);letter-spacing:.035em"><b style="color:#eefcff">SIZE</b> = N &nbsp;·&nbsp; <b style="color:#eefcff">GLOW</b> = +NET &nbsp;·&nbsp; <b style="color:#eefcff">DARK</b> = −NET &nbsp;·&nbsp; <b style="color:#eefcff">RING</b> = DIRECTION</div>';
    drawer.insertBefore(grammar,cutoffSec||drawer.lastElementChild);

    const sec=document.createElement('div');
    sec.className='sec';
    const sliderMax=Math.max(100,ARGUS_MAX_N),step=sliderMax>500?10:sliderMax>150?5:1;
    sec.innerHTML='<div class="label">MIN OCCURRENCES · N ≥</div><div class="rangeWrap"><input id="occN" type="range" min="0" max="'+sliderMax+'" step="'+step+'" value="'+Math.min(ui.minN,sliderMax)+'"><span id="occNV" style="font-size:10px;color:#dff7ff;min-width:54px;text-align:right">N ≥ '+ui.minN+'</span></div><div id="occQuick" class="row" style="margin-top:7px"></div>';
    drawer.insertBefore(sec,cutoffSec||drawer.lastElementChild);

    const input=sec.querySelector('#occN'),value=sec.querySelector('#occNV');
    input.oninput=()=>{
      ui.minN=+input.value;
      value.textContent='N ≥ '+ui.minN;
      updateStats();
      persistView();
    };
    input.onchange=()=>showToast(ui.minN?'N ≥ '+ui.minN+' · low-sample nodes hidden':'occurrence filter cleared');

    const quick=sec.querySelector('#occQuick');
    [0,10,25,50,100].forEach(n=>{
      const b=document.createElement('button');
      b.className='chip'+(ui.minN===n?' on':'');
      b.textContent=n===0?'ALL':'N≥'+n;
      b.onclick=()=>{
        ui.minN=n;
        renderDrawer();
        updateStats();
        persistView();
        showToast(n?'N ≥ '+n:'all occurrence counts');
      };
      quick.appendChild(b);
    });
  };

  const __revealSecurity=revealSecurity;
  revealSecurity=function(si){ui.minN=0;return __revealSecurity(si)};

  const __loadData=loadData;
  loadData=async function(first=false){
    const out=await __loadData(first);
    refreshOccurrenceRange();
    return out;
  };

  refreshOccurrenceRange();
  renderDrawer();
  updateStats();
  showToast('OCCURRENCE + PERFORMANCE · ACTIVE');
})();
`;
  d.body.appendChild(patch);
});
</script>
</body>
</html>

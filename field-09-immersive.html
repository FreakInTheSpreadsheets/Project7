 ctx.beginPath();ctx.ellipse(p.x,p.y,rr*.88,rr*.28,.18,0,7);ctx.stroke();
 ctx.beginPath();ctx.ellipse(p.x,p.y,rr*.30,rr*.88,-.35,0,7);ctx.stroke();

 const showLabel=(!focusUniverse)||(focusUniverse===u.id&&dist>u.r*1.25);
 if(showLabel){
   const fs=clamp(10+p.f*1.7,10,19);
   ctx.font=`600 ${fs}px -apple-system,BlinkMacSystemFont,sans-serif`;
   ctx.textAlign='center';ctx.fillStyle=hsla(u.h,64,82,u.dormant?.35:.76);
   ctx.fillText(u.label.toUpperCase(),p.x,p.y-rr*.98-7);
 }
 sphereHits.push({x:p.x,y:p.y,r:rr*.93,u});
}
function baseNodePosition(n,u){
 const id=n.id;
 const a=hash(id+'a')*Math.PI*2;
 const el=(hash(id+'e')-.5)*1.55;
 let rr=2.4+hash(id+'r')*(u.r*.72);
 let x=Math.cos(a)*Math.cos(el)*rr;
 let y=Math.sin(el)*rr;
 let z=Math.sin(a)*Math.cos(el)*rr;

 if(u.id==='observation'){
   y+=(Math.log1p(n.obs)/Math.log(120)-.5)*u.r*.45;
 }else if(u.id==='recurrence'){
   const v=visibleLayerMetric(n.rec0,n.rec1);
   y+=(v-.5)*u.r*.82;
 }else if(u.id==='topology'){
   rr=2.4+clamp(n.lag/70,0,1)*u.r*.62;
   x=Math.cos(a)*Math.cos(el)*rr;z=Math.sin(a)*Math.cos(el)*rr;
 }else if(u.id==='direction'){
   const v=visibleLayerMetric(n.dir0,n.dir1);
   y+=(v-.28)*u.r*.85;
 }else if(u.id==='combination'){
   y+=(Math.log1p(n.combo)/Math.log(260)-.5)*u.r*.58;
 }else if(u.id==='economics'){
   const v=visibleLayerMetric(n.econ0,n.econ1);
   y+=clamp(v,-.12,.28)*u.r*2.1;
 }else if(u.id==='null'){
   y+=(n.null-.5)*u.r*.78;
 }
 return{x:u.x+x,y:u.y+y,z:u.z+z};
}
function edgeWeight(e,u){
 if(u.id==='recurrence')return clamp(visibleLayerMetric(e.rec0,e.rec1),0,1);
 if(u.id==='topology')return clamp(e.n/40,0.08,1);
 if(u.id==='direction')return clamp(visibleLayerMetric(e.dir0,e.dir1),0,1);
 if(u.id==='economics')return clamp((visibleLayerMetric(e.econ0,e.econ1)+.05)/.25,0,1);
 if(u.id==='null')return clamp(e.null,0,1);
 return .18;
}
function drawMetricEdges(u,alphaScale){
 if(['observation','combination','prospective','paper'].includes(u.id))return;
 const maxEdges=dist<10?900:dist<18?520:220;
 const edges=[...DATA.directEdges].sort((a,b)=>edgeWeight(b,u)-edgeWeight(a,u)).slice(0,maxEdges);
 for(const e of edges){
   const a=project(baseNodePosition(NODE[e.s],u)),b=project(baseNodePosition(NODE[e.t],u));
   if(!a||!b)continue;
   const w=edgeWeight(e,u);
   ctx.strokeStyle=hsla(u.h,70,68,(.018+w*.16)*alphaScale);
   ctx.lineWidth=.45+w*1.1;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
}
function drawCommonMovement(u,alphaScale){
 if(['observation','prospective','paper'].includes(u.id))return;
 for(const e of DATA.movementEdges){
   const na=NODE[e.a],nb=NODE[e.b];if(!na||!nb)continue;
   const a=project(baseNodePosition(na,u)),b=project(baseNodePosition(nb,u));
   if(!a||!b)continue;
   const w=clamp(e.common,0,1);
   const alpha=(.045+Math.pow(w,.9)*.42)*alphaScale;

   // glow pass
   ctx.save();
   ctx.strokeStyle=hsla(u.h,84,72,alpha*.34);
   ctx.lineWidth=2.2+w*5.2;
   ctx.shadowColor=hsla(u.h,95,72,.72);
   ctx.shadowBlur=3+w*18;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   ctx.shadowBlur=0;

   // luminous core
   ctx.strokeStyle=hsla(u.h,92,82,alpha);
   ctx.lineWidth=.7+w*1.6;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   ctx.restore();
 }
}
function drawNodes(u,alphaScale){
 nodeHits=[];
 const inside=focusUniverse===u.id;
 const depth=inside?clamp((u.r*2.8-dist)/(u.r*2.8-3.8),0,1):0;
 const rows=DATA.nodes.map(n=>{
   const p=project(baseNodePosition(n,u));return p?{n,p}:null;
 }).filter(Boolean).sort((a,b)=>b.p.z-a.p.z);

 for(const d of rows){
   const prominence=u.id==='combination'?Math.log1p(d.n.combo)/Math.log(260):
                    u.id==='observation'?Math.log1p(d.n.obs)/Math.log(120):.45;
   const r=clamp((1.0+prominence*1.7)*d.p.f*5,.65,inside?7:2.8);
   const a=(.12+depth*.62)*alphaScale;
   ctx.fillStyle=hsla(u.h,78,74,a);
   ctx.beginPath();ctx.arc(d.p.x,d.p.y,r,0,7);ctx.fill();
   if(inside)nodeHits.push({x:d.p.x,y:d.p.y,r:Math.max(10,r+5),n:d.n,u});
 }
 if(inside)drawNodeLabels(u,rows,depth);
}
function drawNodeLabels(u,rows,depth){
 let cap=0;
 if(dist<u.r*2.0)cap=12;
 if(dist<u.r*1.35)cap=24;
 if(dist<u.r*.85)cap=48;
 if(cap===0)return;

 const selected=selectedNode&&selectedNode.u.id===u.id?selectedNode.n.id:null;
 const ranked=[...rows].sort((a,b)=>{
   const ac=Math.hypot(a.p.x-W*.5,a.p.y-H*.5),bc=Math.hypot(b.p.x-W*.5,b.p.y-H*.5);
   return ac-bc;
 });
 const placed=[];
 let shown=0;
 ctx.font='600 11px -apple-system,BlinkMacSystemFont,sans-serif';
 for(const d of ranked){
   if(d.n.id===selected)continue;
   if(placed.some(p=>Math.hypot(p.x-d.p.x,p.y-d.p.y)<40)&&cap<48)continue;
   ctx.fillStyle=hsla(u.h,55,88,.74);
   ctx.fillText(d.n.id,d.p.x+5,d.p.y-5);
   placed.push(d.p);shown++;if(shown>=cap)break;
 }
 if(selected){
   const d=rows.find(x=>x.n.id===selected);
   if(d){
     ctx.save();
     ctx.font='700 14px -apple-system,BlinkMacSystemFont,sans-serif';
     const w=ctx.measureText(selected).width+18,h=30;
     let x=d.p.x+12,y=d.p.y-15;if(x+w>W-50)x=d.p.x-w-12;
     ctx.fillStyle='rgba(2,8,12,.88)';ctx.strokeStyle=hsla(u.h,80,72,.72);
     ctx.lineWidth=1.2;ctx.beginPath();
     if(ctx.roundRect)ctx.roundRect(x,y,w,h,9);else ctx.rect(x,y,w,h);
     ctx.fill();ctx.stroke();ctx.fillStyle='rgba(245,252,255,.96)';
     ctx.fillText(selected,x+9,y+20);ctx.restore();
   }
 }
}
function drawFocusedUniverse(u){
 const boundary=u.r*1.35;
 const insideFactor=clamp((boundary*1.35-dist)/(boundary*1.35-3.8),0,1);
 const fieldAlpha=.22+insideFactor*.78;

 drawMetricEdges(u,fieldAlpha);
 drawCommonMovement(u,fieldAlpha);
 drawNodes(u,fieldAlpha);
 drawSphere(u);
}
function drawOverview(){
 for(const b of DATA.bridges){
   if(universeVisible(b.from_universe)&&universeVisible(b.to_universe)){
     drawBridge(BYID[b.from_universe],BYID[b.to_universe]);
   }
 }
 const arr=U.filter(u=>universeVisible(u.id)).map(u=>({u,p:project(u)})).filter(x=>x.p).sort((a,b)=>b.p.z-a.p.z);
 for(const {u} of arr)drawSphere(u);
}
function render(){
 target.x+=(focusTarget.x-target.x)*.095;target.y+=(focusTarget.y-target.y)*.095;target.z+=(focusTarget.z-target.z)*.095;
 dist+=(focusDist-dist)*.095;
 sphereHits=[];nodeHits=[];
 bg();
 if(focusUniverse&&universeVisible(focusUniverse))drawFocusedUniverse(BYID[focusUniverse]);
 else drawOverview();
 drawZoomRail();
 requestAnimationFrame(render);
}

// Right-side slider, drawn in canvas.
function zoomTo(z){focusDist=dist=clamp(z,MIN_ZOOM,MAX_ZOOM)}
function zoomT(){return clamp(Math.log(focusDist/MIN_ZOOM)/Math.log(MAX_ZOOM/MIN_ZOOM),0,1)}
function railGeom(){const x=W-Math.max(27,W*.021),top=H*.18,bottom=H*.80;return{x,top,bottom,h:bottom-top,hit:52}}
function drawZoomRail(){
 const g=railGeom(),y=g.top+zoomT()*g.h;
 ctx.save();ctx.lineCap='round';
 ctx.strokeStyle='rgba(215,246,255,.22)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(g.x,g.top);ctx.lineTo(g.x,g.bottom);ctx.stroke();
 ctx.strokeStyle='rgba(101,228,255,.72)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(g.x,g.top);ctx.lineTo(g.x,g.bottom);ctx.stroke();
 ctx.shadowColor='rgba(88,225,255,.8)';ctx.shadowBlur=16;ctx.fillStyle='rgba(88,225,255,.96)';
 ctx.beginPath();ctx.arc(g.x,y,14,0,7);ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(g.x,y,14,0,7);ctx.stroke();ctx.restore();
}
function railHit(x,y){const g=railGeom();return x>g.x-g.hit&&y>g.top-20&&y<g.bottom+20}
function railSet(y){const g=railGeom(),t=clamp((y-g.top)/g.h,0,1);zoomTo(MIN_ZOOM*Math.pow(MAX_ZOOM/MIN_ZOOM,t))}

const pointers=new Map();let railPointer=null,drag=false,tapStart=null;
c.addEventListener('pointerdown',e=>{
 if(railHit(e.clientX,e.clientY)){railPointer=e.pointerId;c.setPointerCapture(e.pointerId);railSet(e.clientY);return}
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);tapStart={x:e.clientX,y:e.clientY};drag=false;
});
c.addEventListener('pointermove',e=>{
 if(e.pointerId===railPointer){railSet(e.clientY);return}
 if(!pointers.has(e.pointerId))return;
 const p=pointers.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(tapStart&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>6)drag=true;
 yaw+=dx*.0052;pitch=clamp(pitch+dy*.0038,-1.18,1.18);
});
c.addEventListener('pointerup',e=>{
 if(e.pointerId===railPointer){railPointer=null;return}
 if(!pointers.has(e.pointerId))return;
 pointers.delete(e.pointerId);
 if(!drag&&tapStart&&Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)<9){
   if(focusUniverse){
     let hit=null,bd=Infinity;
     for(const h of nodeHits){const d=Math.hypot(e.clientX-h.x,e.clientY-h.y);if(d<h.r&&d<bd){hit=h;bd=d}}
     selectedNode=hit||null;
   }else{
     let hit=null,bd=Infinity;
     for(const h of sphereHits){const d=Math.hypot(e.clientX-h.x,e.clientY-h.y);if(d<h.r&&d<bd){hit=h;bd=d}}
     if(hit){
       selectedNode=null;focusUniverse=hit.u.id;
       focusTarget={x:hit.u.x,y:hit.u.y,z:hit.u.z};
       focusDist=hit.u.r*2.8; // deliberately outside the sphere
     }
   }
 }
 tapStart=null;drag=false;
});
c.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(e.pointerId===railPointer)railPointer=null;tapStart=null;drag=false});

function home(){
 selectedNode=null;focusUniverse=null;focusTarget={x:0,y:0,z:0};target={x:0,y:0,z:0};
 focusDist=dist=128;yaw=-.20;pitch=-.08;
}
const bar=document.getElementById('universeBar');
for(const u of U){
 const b=document.createElement('button');b.className='uToggle on';b.textContent=shortNames[u.id];b.style.borderColor=hsla(u.h,75,65,.5);
 b.onclick=()=>{
   if(visibleUniverses.has(u.id)){
     visibleUniverses.delete(u.id);b.classList.remove('on');
     if(focusUniverse===u.id)home();
   }else{visibleUniverses.add(u.id);b.classList.add('on')}
 };
 bar.appendChild(b);
}
document.getElementById('older').onclick=()=>mode=0;
document.getElementById('later').onclick=()=>mode=1;
document.getElementById('overlay').onclick=()=>mode=2;
document.getElementById('home').onclick=home;
render();
</script>
</body>
</html>

};

let realityField={key:'',state:new Map(),last:performance.now(),active:0,bary:{x:0,y:0,z:0},mass:0};

let lastFeedFingerprint='';

function hueForUniverse(id){return (PAL[ui.palette]||PAL.argus)[id]??194}
function qmeta(si){return DATA?.qualified_meta?.[String(si)]||null}
function isQualified(si){return QSET.has(si)||!!qmeta(si)}
function isHot(si){return HSET.has(si)}
function isProspective(si){return PSET.has(si)}
function isConflict(si){return CSET.has(si)}
function metric(si,k,d=0){return finite(DATA?.metrics?.[si]?.[k],d)}
function fireWindow(){return Math.max(0,Math.min(60,finite(DATA?.fire_window_days,0)))}
function fireDays(si){const q=qmeta(si);if(Number.isFinite(+q?.fire_days_60))return Math.max(0,+q.fire_days_60);return Math.max(0,finite(DATA?.fire_days_60?.[si],0))}
function fireRate(si){const w=fireWindow();return w?clamp(fireDays(si)/w,0,1):0}
function opportunityScore(si){
 const q=qmeta(si),freq=fireRate(si),effect=q?clamp(Math.max(finite(q.net),0)/8,0,1):clamp(Math.max(metric(si,3),0)/.08,0,1),rel=q?clamp(finite(q.dir),0,1):clamp(metric(si,2),0,1),links=clamp(metric(si,5)/10,0,1),live=isProspective(si)?1:(isHot(si)?.75:0);
 return clamp(freq*.22+effect*.28+rel*.25+links*.15+live*.10,0,1)

function strength(si,u){
 const m=DATA.metrics[si]||[];
 if(u.id==='observation')return clamp(Math.log1p(finite(m[0]))/7,0,1);
 if(u.id==='magnitude')return clamp(clamp(finite(m[9])/8,0,1)*.65+clamp(finite(m[10])/25,0,1)*.35,0,1);

 if(u.id==='direction')return clamp(finite(m[2]),0,1);
 if(u.id==='immediacy')return clamp(finite(m[14]),0,1);
 if(u.id==='generalization')return clamp(finite(m[13]),0,1);
 if(u.id==='economics')return clamp((finite(m[3])+.1)/.4,0,1);
 if(u.id==='null')return clamp(finite(m[4]),0,1);
 if(u.id==='topology')return clamp(finite(m[5])/10,0,1);
 if(u.id==='combination')return clamp(finite(m[6])/8,0,1);
 if(u.id==='prospective')return isProspective(si)?1:(isQualified(si)?.35:0);

}
function nodeVisible(si){
 if(isolated!==null && si!==isolated && !wormPath.has(si)) return false;
 if(ui.show==='qualified'&&!isQualified(si))return false;

 if(ui.show==='prospective'&&!isProspective(si))return false;
 if(ui.show==='conflict'&&!isConflict(si))return false;
 const qm=qmeta(si);
 if(familyKey && (!qm || `${qm.family}|${qm.signature}|${qm.direction}|${qm.horizon}`!==familyKey))return false;
 const dirAcc=qm?finite(qm.dir):metric(si,2);
 if(ui.cutoff>0 && dirAcc<ui.cutoff)return false;
 return true
}
function colorFor(si,u,alpha=1){
 const qm=qmeta(si),m=DATA.metrics[si]||[];
 if(isHot(si))return `rgba(255,255,255,${alpha})`;
 if(isConflict(si)&&ui.color==='direction')return `rgba(${Math.sin(performance.now()/120)>0?255:60},${Math.sin(performance.now()/120)>0?70:220},${Math.sin(performance.now()/120)>0?105:255},${alpha})`;
 if(ui.color==='direction'&&qm){
   const d=(qm.direction||'').toUpperCase(); return d.includes('RISE')?`rgba(70,232,255,${alpha})`:d.includes('FALL')?`rgba(255,74,105,${alpha})`:hsla(280,90,76,alpha);
 }
 if(ui.color==='confidence'){const v=qm?clamp(qm.dir,0,1):metric(si,2);return hsla(205+85*v,90,62+20*v,alpha)}
 if(ui.color==='economics'){const v=qm?clamp(qm.net/10,0,1):clamp((metric(si,3)+.02)/.12,0,1);return hsla(250-210*v,92,62+18*v,alpha)}
 if(ui.color==='recurrence'){const v=metric(si,1);return hsla(180+120*v,90,64+12*v,alpha)}
 return hsla(hueForUniverse(u.id),88,74,alpha)
}
function nodeRadius(si,u,pf){
 const qm=qmeta(si); let v=.35;
 if(ui.size==='sample')v=qm?clamp(Math.log1p(qm.n)/4,0,1):clamp(Math.log1p(metric(si,0))/7,0,1);
 if(ui.size==='effect')v=qm?clamp(Math.abs(qm.net)/10,0,1):clamp(Math.abs(metric(si,3))/.1,0,1);

 if(ui.size==='expectancy')v=qm?clamp(Math.max(qm.net,0)/10,0,1):clamp(Math.max(metric(si,3),0)/.1,0,1);

}
function uobj(id){const p=POS[id]||[0,0,0];return{id,x:p[0],y:p[1],z:p[2],r:RAD[id]||11,h:hueForUniverse(id)}}
function tracePolygon(x,y,r,n,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}

function paintNodeMark(si,x,y,r){
 const dm=ui.display||'graph';
 if(dm==='graph'){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();return}

}
function curveControl(a,b,bend=0){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return{x:mx+nx*len*bend,y:my+ny*len*bend}}

function curvePoint(a,b,t,bend=0){if(Math.abs(bend)<.0001)return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};const q=curveControl(a,b,bend),u=1-t;return{x:u*u*a.x+2*u*t*q.x+t*t*b.x,y:u*u*a.y+2*u*t*q.y+t*t*b.y}}

function shortestPath(a,b){
 const adj=new Map(),packs=[DATA.edges.common||[],DATA.edges.qualified||[]];for(const pack of packs)for(const e of pack){if(!adj.has(e[0]))adj.set(e[0],[]);if(!adj.has(e[1]))adj.set(e[1],[]);adj.get(e[0]).push(e[1]);adj.get(e[1]).push(e[0])}
 const q=[a],prev=new Map([[a,null]]);for(let qi=0;qi<q.length;qi++){const x=q[qi];if(x===b)break;for(const y of adj.get(x)||[])if(!prev.has(y)){prev.set(y,x);q.push(y)}}if(!prev.has(b))return[];
 const out=[];let x=b;while(x!==null){out.push(x);x=prev.get(x)}return out.reverse()
}

function pointerDown(e){const p=e.touches?e.touches[0]:e;lastX=p.clientX;lastY=p.clientY;drag=true;verticalRailDrag=verticalRailHit(lastX,lastY);railDrag=!verticalRailDrag&&railHit(lastX,lastY);if(verticalRailDrag)verticalRailSet(lastY);else if(railDrag)railSet(lastY);lastMove=0;e.preventDefault()}
function pointerMove(e){if(!drag)return;const p=e.touches?e.touches[0]:e,x=p.clientX,y=p.clientY,dx=x-lastX,dy=y-lastY;lastMove+=Math.abs(dx)+Math.abs(dy);if(verticalRailDrag)verticalRailSet(y);else if(railDrag)railSet(y);else{yaw+=dx*.005;pitch=clamp(pitch+dy*.004,-1.25,1.25)}lastX=x;lastY=y;e.preventDefault()}
function pointerUp(e){if(!drag)return;drag=false;if(verticalRailDrag){verticalRailDrag=false;persistView();return}if(railDrag){railDrag=false;persistView();return}const p=e.changedTouches?e.changedTouches[0]:e,x=p.clientX,y=p.clientY;if(lastMove>12)return;
 const dbl=isDoubleTap(x,y);
 if(ui.layout==='fusion'){
   const n=hitNode(x,y);if(n){showSelected(n);return}
   const ah=hitFusionAnchor(x,y);if(ah){setFocus(ah.u.id);return}
   if(dbl){home();showToast('fusion view reset');return}
   hideSelected();shiftViewToward(x,y);return
 }
 if(focus){
   if(focus==='direction'){const ph=hitPattern(x,y);if(ph){const g=ph.g;showToast(`${g.signature} → ${g.direction} · members ${g.member_count||g.members?.length||0} · dir ${(finite(g.accuracy)*100).toFixed(1)}% · net ${(finite(g.net)*100).toFixed(2)}%`);return}}
   const n=hitNode(x,y);if(n){if(wormStart!==null&&wormStart!==n.si){const path=shortestPath(wormStart,n.si);wormPath=new Set(path);wormStart=null;showSelected(n);showToast(path.length?`wormhole path: ${path.length-1} hops`:'no path');return}showSelected(n);return}
   if(dbl){home();showToast('view reset');return}
   hideSelected();shiftViewToward(x,y);return}
 const ph=hitPattern(x,y);if(ph){setFocus('direction');showToast(`${ph.g.signature||'pattern'} · ${(finite(ph.g.accuracy)*100).toFixed(1)}%`);return}
 const sh=hitSphere(x,y);if(sh){setFocus(sh.u.id);return}
 if(dbl){home();showToast('view reset');return}
 hideSelected();shiftViewToward(x,y);persistView()}
c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',()=>{drag=false;railDrag=false;verticalRailDrag=false});
c.addEventListener('wheel',e=>{zoom(dist*Math.exp(e.deltaY*.0015));persistView();e.preventDefault()},{passive:false});

function snapshotView(){
 const sym=i=>Number.isInteger(i)&&DATA?.symbols?.[i]?DATA.symbols[i]:null;
 return {ui:{...ui},focus,target:{...target},dist,yaw,pitch,verticalOffset,selectedSymbol:selected?sym(selected.si):null,
         isolatedSymbol:sym(isolated),wormSymbols:[...wormPath].map(sym).filter(Boolean)}
}
function persistView(){try{sessionStorage.setItem(VIEW_STATE_KEY,JSON.stringify(snapshotView()))}catch(e){}}
function restoreView(){
 try{
   const v=JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY)||'null');if(!v)return;
   if(v.ui)ui={...ui,...v.ui};if(v.focus)focus=v.focus;if(v.target)target={...target,...v.target};
   if(Number.isFinite(v.dist))dist=v.dist;if(Number.isFinite(v.yaw))yaw=v.yaw;if(Number.isFinite(v.pitch))pitch=v.pitch;if(Number.isFinite(v.verticalOffset))verticalOffset=clamp(v.verticalOffset,VERTICAL_MIN,VERTICAL_MAX);
   const ix=new Map((DATA?.symbols||[]).map((s,i)=>[s,i]));
   if(v.selectedSymbol&&ix.has(v.selectedSymbol)){const si=ix.get(v.selectedSymbol);selected={si,u:focus?uobj(focus):fusionDominantUniverse(si)}}
   if(v.isolatedSymbol&&ix.has(v.isolatedSymbol))isolated=ix.get(v.isolatedSymbol);
   wormPath=new Set((v.wormSymbols||[]).map(s=>ix.get(s)).filter(Number.isInteger));
 }catch(e){}
}
function feedFingerprint(d){
 const n=d?.counts||{};return [d?.checkpoint_batch_id||'',n.qualified_patterns||0,n.prospective_watchlist||0,n.prospective_signals||0,n.open_paper_positions||0,n.closed_paper_trades||0,d?.snapshot||''].join('|')
}
function chips(title,key,items){return `<div class="sec"><div class="label">${title}</div><div class="row">${items.map(([v,t])=>`<button class="chip ${ui[key]===v?'on':''}" data-key="${key}" data-val="${v}">${t}</button>`).join('')}</div></div>`}
function renderDrawer(){
 const d=document.getElementById('drawer');
 d.innerHTML=
 chips('LAYOUT','layout',[['universes','UNIVERSES'],['fusion','FUSION']])+
 chips('DISPLAY','display',[['graph','GRAPH'],['glyphs','GLYPHS'],['waves','WAVES']])+
 chips('SHOW','show',[['all','ALL'],['qualified','QUALIFIED'],['hot','HOLY SHIT'],['prospective','PROSPECTIVE'],['conflict','CONFLICT']])+
 chips('COLOR','color',[['universe','UNIVERSE'],['direction','POLARITY'],['confidence','CONFIDENCE'],['economics','ECONOMICS'],['recurrence','RECURRENCE']])+
 chips('SIZE','size',[['sample','SAMPLE'],['effect','EFFECT'],['connectivity','LINKS'],['expectancy','EXPECTANCY']])+
 chips('DIMENSION','dimension',[['native','NATIVE'],['certainty','CERTAINTY'],['economics','ECON'],['recurrence','RECURRENCE'],['frequency','FREQUENCY'],['magnitude','MAGNITUDE'],['generalization','GENERALIZE'],['immediacy','IMMEDIACY'],['connectivity','NETWORK'],['tension','TENSION'],['delta','Δ TIME']])+
 chips('PALETTE','palette',[['argus','ARGUS'],['aurora','AURORA'],['thermal','THERMAL'],['evidence','EVIDENCE'],['polarity','POLARITY']])+
 chips('REALITY','reality',[['prime','PRIME'],['alt1','ALT-1'],['alt2','ALT-2'],['alt3','ALT-3']])+
 chips('PHYSICS','physics',[['normal','NORMAL'],['gravity','GRAVITY'],['opportunity-g','OPPORTUNITY-G'],['reality-g','REALITY-G'],['sector-g','SECTOR-G'],['zero-g','ZERO-G'],['explode','EXPLODE'],['orbit','ORBIT'],['magnetize','MAGNETIZE']])+
 chips('TOOLS','tool',[['none','CLEAR'],['inversion','INVERSION'],['echo','ECHO'],['kaleido','KALEIDOSCOPE'],['ghost','GHOST'],['xray','X-RAY'],['constellation','CONSTELLATION'],['trails','TRAILS'],['freeze','FREEZE'],['blackhole','BLACK HOLE']])+
 chips('CONNECTIONS','edgeMode',[['all','ALL'],['qualified','QUALIFIED']])+
 `<div class="sec"><div class="label">MIN DIRECTIONAL ACCURACY</div><div class="rangeWrap"><input id="cut" type="range" min="0" max="95" step="5" value="${Math.round(ui.cutoff*100)}"><span id="cutV" style="font-size:10px;color:#dff7ff">${Math.round(ui.cutoff*100)}%</span></div></div>`+
 `<div class="sec"><div class="row"><button id="shake" class="chip">SHAKE</button><button id="reset" class="chip">RESET FIELD</button></div></div>`;
 d.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key,v=b.dataset.val;if(k==='layout'){setLayout(v);return}ui[k]=v;if(k==='reality'){fusionState.clear();fusionLast=performance.now();showToast(v==='prime'?'PRIME REALITY':v.toUpperCase()+' · same evidence, alternate embedding')}if(k==='physics'){realityField={key:'',state:new Map(),last:performance.now(),active:0,bary:{x:0,y:0,z:0},mass:0}}if(k==='physics'&&v==='reality-g'){fusionState.clear();fusionLast=performance.now();showToast('REALITY-G · INTERACTING GRAVITY · movement changes movement')}if(k==='tool'&&(v==='inversion'||v==='kaleido'))showToast(v.toUpperCase()+' · visual transform only');if(k==='display')showToast(v==='graph'?'GRAPH · nodes + connections':v==='glyphs'?'GLYPHS · evidence states as shapes + curved paths':'WAVES · firing frequency + strength as propagating fields');renderDrawer();if(selected)buildSelectedButtons();persistView()});
 const cut=d.querySelector('#cut');cut.oninput=()=>{ui.cutoff=+cut.value/100;d.querySelector('#cutV').textContent=cut.value+'%';persistView()};
 d.querySelector('#shake').onclick=()=>{shakeUntil=performance.now()+1800;showToast('field shaken')};
 d.querySelector('#reset').onclick=()=>{ui={layout:'universes',display:'graph',show:'all',color:'universe',size:'sample',dimension:'native',physics:'normal',tool:'none',reality:'prime',palette:'argus',cutoff:0,edgeMode:'all'};isolated=null;familyKey=null;wormPath.clear();fusionState.clear();realityField={key:'',state:new Map(),last:performance.now(),active:0,bary:{x:0,y:0,z:0},mass:0};home();renderDrawer();persistView();showToast('field reset')};
}
document.getElementById('drawerToggle').onclick=()=>{document.getElementById('searchPanel').classList.remove('open');document.getElementById('drawer').classList.toggle('open')};
document.getElementById('selClose').onclick=()=>{selected=null;hideSelected()};
for(const [id,val] of [['old',0],['new',1],['both',2]])document.getElementById(id).onclick=()=>{mode=val;for(const x of ['old','new','both'])document.getElementById(x).style.outline='none';document.getElementById(id).style.outline='2px solid rgba(255,255,255,.55)'};
document.getElementById('home').onclick=home;

function searchMatches(q){q=String(q||'').trim().toUpperCase();if(!q)return[];const all=(DATA?.symbols||[]).map((s,i)=>({s,i,score:s.toUpperCase()===q?0:s.toUpperCase().startsWith(q)?1:s.toUpperCase().includes(q)?2:9})).filter(x=>x.score<9);all.sort((a,b)=>a.score-b.score||a.s.length-b.s.length||a.s.localeCompare(b.s));return all.slice(0,12)}
function renderSearchResults(){const q=document.getElementById('securitySearch').value,box=document.getElementById('searchResults'),m=searchMatches(q);box.innerHTML='';for(const x of m){const b=document.createElement('button');b.type='button';b.className='searchResult';const sec=sectorLabel(x.i),qm=qmeta(x.i),fw=fireWindow(),fd=fireDays(x.i);b.innerHTML=`<div class="searchSym">${x.s}${isHot(x.i)?' ✦':''}</div><div class="searchMeta">${sec?sec+' · ':''}${qm?qm.direction+' · '+qm.horizon+'m · ':''}${fw?fd+'/'+fw+' fire days':'frequency pending'}</div>`;b.onclick=()=>revealSecurity(x.i);box.appendChild(b)}if(q&&!m.length){box.innerHTML='<div class="searchMeta" style="padding:8px">No matching observed security.</div>'}}
function revealSecurity(si){document.getElementById('searchPanel').classList.remove('open');document.getElementById('drawer').classList.remove('open');familyKey=null;isolated=null;wormPath.clear();ui.show='all';ui.cutoff=0;ui.layout='fusion';focus=null;const u=fusionDominantUniverse(si),d=fusionDesired(si);target={x:d.x,y:d.y,z:d.z};dist=18;yaw=-.18;pitch=-.08;selected={si,u};selectedNeighbors=neighborsOf(si);showSelected(selected);syncUniverseButtons();renderDrawer();persistView();showToast(`${DATA.symbols[si]} located in FUSION`)}
const searchPanel=document.getElementById('searchPanel'),searchInput=document.getElementById('securitySearch');
document.getElementById('searchToggle').onclick=()=>{const open=!searchPanel.classList.contains('open');document.getElementById('drawer').classList.remove('open');searchPanel.classList.toggle('open',open);if(open){searchInput.value='';renderSearchResults();setTimeout(()=>searchInput.focus(),30)}};
searchInput.addEventListener('input',renderSearchResults);searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=searchMatches(searchInput.value);if(m[0])revealSecurity(m[0].i)}if(e.key==='Escape')searchPanel.classList.remove('open')});
async function toggleFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen){await document.exitFullscreen();document.body.classList.remove('immersive');return}if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();document.body.classList.add('immersive');return}}catch(e){}document.body.classList.toggle('immersive');showToast(document.body.classList.contains('immersive')?'IMMERSIVE FULLSCREEN':'FULL UI')}
document.getElementById('fullToggle').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('immersive',!!document.fullscreenElement)});

function syncUniverseButtons(){document.querySelectorAll('.ub').forEach(b=>b.classList.toggle('on',b.dataset.id==='__fusion__'?ui.layout==='fusion':(ui.layout==='universes'&&b.dataset.id===focus)))}
function initUI(){
 const bar=document.getElementById('universes');bar.innerHTML='';const all=document.createElement('button');all.className='ub';all.dataset.id='__fusion__';all.textContent='FUSION';all.onclick=()=>setLayout(ui.layout==='fusion'?'universes':'fusion');bar.appendChild(all);for(const u of DATA.universes||[]){const b=document.createElement('button');b.className='ub';b.dataset.id=u.id;b.textContent=SHORT[u.id]||u.label.toUpperCase();b.onclick=()=>focus===u.id&&ui.layout==='universes'?home():setFocus(u.id);bar.appendChild(b)}
 renderDrawer();syncUniverseButtons();updateStats()
}
function updateStats(){const n=DATA?.counts||{},sc=n.sector_classified_symbols?` · ${n.sector_classified_symbols} sector-mapped`:'';document.getElementById('stats').textContent=`${n.symbols??DATA?.symbols?.length??0} observed · ${n.qualified_patterns??0} qualified · ${n.qualified_symbols??0} symbols · ${n.hot_symbols??DATA?.hot_indices?.length??0} hot · ${n.conflict_symbols??DATA?.conflict_indices?.length??0} conflict${sc}${ui.layout==='fusion'&&fusionActiveCount?` · ${fusionActiveCount} moving`:''} · DIM ${String(ui.dimension||'native').toUpperCase()} · LIVE 60s · ${DATA?.snapshot||''}`}
function normalizeOld(d){d.edges=d.edges||{};d.qualified_meta=d.qualified_meta||{};d.qualified_indices=d.qualified_indices||[];d.hot_indices=d.hot_indices||[];d.conflict_indices=d.conflict_indices||[];d.prospective_indices=d.prospective_indices||[];d.sector_ids=d.sector_ids||[];d.sectors=d.sectors||[];d.fire_days_60=d.fire_days_60||[];d.fire_window_days=finite(d.fire_window_days,0);return d}
async function fetchData(){
 const paths=['argus-v478-latest.json','argus-latest-compact.json'];let last=null;
 for(const p of paths){try{const r=await fetch(p+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=normalizeOld(await r.json());return d}catch(e){last=e}}
 throw last||new Error('no data')
}
async function loadData(first=false){
 try{
   const d=await fetchData(),fp=feedFingerprint(d),before=DATA?snapshotView():null;
   const symbolLayoutChanged=!!DATA&&(DATA.symbols?.length!==d.symbols?.length||DATA.symbols?.[0]!==d.symbols?.[0]||DATA.symbols?.[DATA.symbols.length-1]!==d.symbols?.[d.symbols.length-1]);
   if(DATA&&fp!==lastFeedFingerprint)PREV=DATA;
   if(symbolLayoutChanged)fusionState.clear();
   DATA=d;lastFeedFingerprint=fp;QSET=new Set(d.qualified_indices||[]);HSET=new Set(d.hot_indices||[]);PSET=new Set(d.prospective_indices||[]);CSET=new Set(d.conflict_indices||[]);lastLoad=Date.now();loadError=false;
   if(first){initUI();restoreView();syncUniverseButtons();renderDrawer();if(selected){showSelected(selected)}updateStats()}
   else{
     if(before){
       const ix=new Map((DATA.symbols||[]).map((s,i)=>[s,i]));
       if(before.selectedSymbol&&ix.has(before.selectedSymbol)){const si=ix.get(before.selectedSymbol);selected={si,u:focus?uobj(focus):fusionDominantUniverse(si)}}
       else if(before.selectedSymbol){selected=null;hideSelected()}
       if(before.isolatedSymbol&&ix.has(before.isolatedSymbol))isolated=ix.get(before.isolatedSymbol);else if(before.isolatedSymbol)isolated=null;
       wormPath=new Set((before.wormSymbols||[]).map(s=>ix.get(s)).filter(Number.isInteger));
     }
     if(selected)showSelected(selected);updateStats();persistView()
   }
 }catch(e){loadError=true;if(first){document.getElementById('stats').textContent='DATA FEED OFFLINE · visualization retained when cached';showToast('feed offline')}}
}
loadData(true);setInterval(()=>loadData(false),LIVE_REFRESH_MS);setInterval(persistView,3000);render();

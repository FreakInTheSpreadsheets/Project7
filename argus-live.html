<!doctype html>
<!-- ARGUS_LIVE_STATUS_WEB_V1_20260929 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Argus Live Status</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f2f4f7}main{max-width:860px;margin:auto;padding:18px 14px 36px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{font-size:24px;margin:0 0 4px}.muted{color:#8e98a5;font-size:13px}.stamp{text-align:right}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #2a3038;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#777}.green .dot{background:#32d583;box-shadow:0 0 10px #32d58366}.yellow .dot{background:#fdb022}.red .dot{background:#f97066}.gray .dot{background:#667085}.banner{border:1px solid #252b33;border-radius:14px;padding:13px 14px;margin-bottom:12px;background:#10141a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#11161d;border:1px solid #252b33;border-radius:16px;padding:14px;min-width:0}.card h2{font-size:14px;margin:0 0 12px;color:#cbd5e1}.metric{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-top:1px solid #1d232b;font-size:13px}.metric:first-of-type{border-top:0}.metric b{text-align:right;overflow-wrap:anywhere}.progress{height:8px;background:#202630;border-radius:999px;overflow:hidden;margin:10px 0 3px}.progress>i{display:block;height:100%;background:#7f8ea3}.err{color:#fda29b;white-space:pre-wrap;font-size:12px;line-height:1.35;margin-top:8px}footer{margin-top:16px;color:#667085;font-size:12px;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:stretch}.stamp{font-size:11px}h1{font-size:22px}}
</style></head><body><main>
<div class="top"><div><h1>ARGUS LIVE</h1><div class="muted">Frozen R4 control + Rolling R5 shadow</div></div><div class="stamp muted" id="stamp">Loading…</div></div>
<div class="banner"><span class="badge gray" id="overall"><span class="dot"></span><span>LOADING</span></span> <span class="muted" id="runtimeText"></span></div>
<div class="grid"><section class="card"><h2>Frozen R4</h2><div id="r4"></div></section><section class="card"><h2>Rolling R5</h2><div id="r5"></div></section><section class="card"><h2>Unified Research</h2><div id="research"></div></section><section class="card"><h2>Universe State</h2><div id="universe"></div></section><section class="card"><h2>System</h2><div id="system"></div></section></div>
<footer>Read-only. Auto-refreshes every 10 seconds.</footer>
<script>
const API='https://egomsethmkyrpymdoauu.supabase.co/functions/v1/argus-live?format=json';
const fmtAge=s=>s==null?'—':s<60?Math.round(s)+'s':s<3600?Math.round(s/60)+'m':(s/3600).toFixed(1)+'h';
const val=(x,f='—')=>(x===undefined||x===null||x==='')?f:x;
const row=(k,v)=>'<div class="metric"><span>'+k+'</span><b>'+val(v)+'</b></div>';
const hc=h=>{h=String(h||'').toUpperCase();return h==='GREEN'?'green':h==='YELLOW'?'yellow':h==='RED'?'red':'gray'};
function draw(s){const pub=s.published_at_utc?new Date(s.published_at_utc):null;document.getElementById('stamp').textContent=pub?'Updated '+pub.toLocaleTimeString():'Waiting for first snapshot';const oh=String(s.overall_health||'WAITING').toUpperCase();const ob=document.getElementById('overall');ob.className='badge '+hc(oh);ob.querySelector('span:last-child').textContent=oh;document.getElementById('runtimeText').textContent=s.runtime&&s.runtime.engine_status?' · engine '+s.runtime.engine_status:'';
const a=s.r4||{};document.getElementById('r4').innerHTML=row('Health',a.health)+row('Stage',a.stage)+row('Heartbeat age',fmtAge(a.heartbeat_age_seconds))+row('Target session',a.target_session)+row('Watchlist',val(a.watchlist_patterns,0)+' patterns / '+val(a.watchlist_symbols,0)+' symbols')+row('Open positions',val(a.open_positions,0))+row('Account equity',a.equity!=null?'$'+Number(a.equity).toFixed(2):'—')+(a.last_error?'<div class="err">'+a.last_error+'</div>':'');
const b=s.r5||{},pct=Number(b.progress_pct||0);document.getElementById('r5').innerHTML=row('Health',b.health)+row('Status',b.status)+row('Heartbeat age',fmtAge(b.heartbeat_age_seconds))+row('Pool progress',val(b.processed_symbols,0)+' / '+val(b.declared_pool_size,0)+' ('+pct.toFixed(1)+'%)')+'<div class="progress"><i style="width:'+Math.min(100,Math.max(0,pct))+'%"></i></div>'+row('Candidate rows',val(b.candidate_rows,0))+row('Scan errors',val(b.scan_errors,0))+row('Watchlist',b.watchlist_ready?'READY':'NOT READY')+row('Eligible watchlist',val(b.watchlist_rows,0)+' patterns / '+val(b.watchlist_symbols,0)+' symbols')+row('Daily core',val(b.daily_core_symbols,0))+row('Discovery',val(b.discovery_symbols,0))+row('Account equity',b.equity!=null?'$'+Number(b.equity).toFixed(2):'—')+(b.last_error?'<div class="err">'+b.last_error+'</div>':'');
const c=s.research||{};document.getElementById('research').innerHTML=row('Health',c.health)+row('Status',c.status)+row('Last cycle',val(c.cycle))+row('Cycle age',fmtAge(c.heartbeat_age_seconds))+row('Historical universe',val(c.historical_universe_completed,0)+' / '+val(c.historical_universe_total,0))+row('Regime map',c.regime_status)+row('Historical 1m',c.historical_1m_status)+row('Historical 5m',c.historical_5m_status)+(c.last_error?'<div class="err">'+c.last_error+'</div>':'');
const u=s.universe||{};document.getElementById('universe').innerHTML=row('Paper eligible',val(u.paper_eligible,0))+row('Unscanned',val(u.unscanned,0))+row('Insufficient data',val(u.insufficient_data,0))+row('Scanned · no pattern',val(u.scanned_no_pattern,0))+row('Fresh scored',val(u.scored,0))+row('R5 qualified',val(u.qualified,0))+(u.error?'<div class="err">'+u.error+'</div>':'');
const d=s.system||{};document.getElementById('system').innerHTML=row('Shutdown mode',d.shutdown_mode)+row('R4 control',d.r4_mode)+row('R5 control',d.r5_mode)+row('Paper only',d.paper_only===false?'NO':'YES')+row('Brokerage',d.brokerage_connection===true?'CONNECTED':'NONE')+row('Publisher age',fmtAge(s.publisher_age_seconds));}
async function refresh(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);draw(await r.json())}catch(e){const ob=document.getElementById('overall');ob.className='badge red';ob.querySelector('span:last-child').textContent='STATUS FETCH ERROR';document.getElementById('runtimeText').textContent=' · '+e.message}}
refresh();setInterval(refresh,10000);
</script></main></body></html>
